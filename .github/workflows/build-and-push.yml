name: Build and Push Policy

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  POLICY_NAME: cerit-cross-traefik
  POLICY_PATH: policies/cerit-cross-traefik
  IMAGE_NAME: registry://${{ secrets.REGISTRY_URL }}/cerit-cross-traefik

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OPA
        run: |
          wget -qO opa https://github.com/open-policy-agent/opa/releases/download/v1.19.1/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/

      - name: Install kwctl
        run: |
          wget -qO kwctl.zip https://github.com/kubewarden/kwctl/releases/download/v1.31.0/kwctl-linux-x86_64.zip
          unzip kwctl.zip
          chmod +x kwctl-linux-x86_64
          sudo mv kwctl-linux-x86_64 /usr/local/bin/kwctl

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build, test, and annotate
        working-directory: ${{ env.POLICY_PATH }}
        run: |
          make test
          make annotated-policy.wasm

      - name: Push policy to registry (tag)
        if: github.ref_type == 'tag'
        working-directory: ${{ env.POLICY_PATH }}
        run: |
          kwctl push annotated-policy.wasm ${{ env.IMAGE_NAME }}:${{ github.ref_name }}

      - name: Push policy to registry (latest)
        if: github.ref_name == 'main' && github.event_name != 'pull_request'
        working-directory: ${{ env.POLICY_PATH }}
        run: |
          kwctl push annotated-policy.wasm ${{ env.IMAGE_NAME }}:latest
