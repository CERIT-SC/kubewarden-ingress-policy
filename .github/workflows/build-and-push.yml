name: Build and Push Policy

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  POLICY_NAME: cerit-cross-traefik
  POLICY_PATH: policies/${{ env.POLICY_NAME }}
  IMAGE_NAME: registry://${{ secrets.REGISTRY_URL }}/${{ env.POLICY_NAME }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: latest

      - name: Set up kwctl
        uses: kubewarden/github-actions@v2
        with:
          version: latest

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build policy WASM
        working-directory: ${{ env.POLICY_PATH }}
        run: |
          make policy.wasm

      - name: Annotate policy
        working-directory: ${{ env.POLICY_PATH }}
        run: |
          make annotated-policy.wasm

      - name: Run unit tests
        working-directory: ${{ env.POLICY_PATH }}
        run: |
          make test

      - name: Push policy to registry (tag)
        if: github.ref_type == 'tag'
        working-directory: ${{ env.POLICY_PATH }}
        run: |
          kwctl push annotated-policy.wasm ${{ env.IMAGE_NAME }}:${{ github.ref_name }}

      - name: Push policy to registry (latest)
        if: github.ref_name == 'main' && github.event_name != 'pull_request'
        working-directory: ${{ env.POLICY_PATH }}
        run: |
          kwctl push annotated-policy.wasm ${{ env.IMAGE_NAME }}:latest
