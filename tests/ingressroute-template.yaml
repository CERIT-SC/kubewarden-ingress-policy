# IngressRoute Template
# =====================
# This file serves as a reference for the IngressRoute structure used in tests.
# The actual YAML is generated dynamically in test-cross-traefik.sh using printf.
#
# Example 1: Host only (no path restriction)
# ------------------------------------------
# apiVersion: traefik.io/v1alpha1
# kind: IngressRoute
# metadata:
#   name: test
# spec:
#   routes:
#   - match: Host(`app.example.com`)
#     kind: Rule
#     services:
#     - name: test
#       port: 80
#
# Example 2: Host with PathPrefix
# -------------------------------
# apiVersion: traefik.io/v1alpha1
# kind: IngressRoute
# metadata:
#   name: test
# spec:
#   routes:
#   - match: Host(`app.example.com`) && PathPrefix(`/api`)
#     kind: Rule
#     services:
#     - name: test
#       port: 80
