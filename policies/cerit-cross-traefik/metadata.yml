rules:
  - apiGroups: ["networking.k8s.io"]
    apiVersions: ["v1"]
    resources: ["ingresses"]
    operations: ["CREATE", "UPDATE"]
  - apiGroups: ["gateway.networking.k8s.io"]
    apiVersions: ["v1"]
    resources: ["gateways"]
    operations: ["CREATE", "UPDATE"]
  - apiGroups: ["gateway.networking.k8s.io"]
    apiVersions: ["v1"]
    resources: ["httproutes"]
    operations: ["CREATE", "UPDATE"]
  - apiGroups: ["traefik.io"]
    apiVersions: ["v1alpha1"]
    resources: ["ingressroutes"]
    operations: ["CREATE", "UPDATE"]
mutating: false
contextAware: true
contextAwareResources:
  - apiVersion: networking.k8s.io/v1
    kind: Ingress
  - apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
  - apiVersion: traefik.io/v1alpha1
    kind: IngressRoute
executionMode: gatekeeper
backgroundAudit: true
annotations:
  io.artifacthub.displayName: CERIT-SC Cross Traefik
  io.artifacthub.resources: Ingress, Gateway, HTTPRoute, IngressRoute
  io.artifacthub.keywords: ingress, gateway, httproute, ingressroute, kubewarden
#  io.kubewarden.policy.ociUrl:
  io.kubewarden.policy.title: cerit-cross-traefik
  io.kubewarden.policy.version: 1.0.0
  io.kubewarden.policy.description: Requires all Ingress, Gateway, HTTPRoute and IngressRoute host and path rules to be unique across resource types
  io.kubewarden.policy.author: Kubewarden developers <cncf-kubewarden-maintainers@lists.cncf.io>
  io.kubewarden.policy.url: https://github.com/CERIT-SC/kubewarden-ingress-policy
  io.kubewarden.policy.source: https://github.com/CERIT-SC/kubewarden-ingress-policy
  io.kubewarden.policy.license: Apache-2.0
  io.kubewarden.policy.severity: medium
  io.kubewarden.policy.category: Resource validation
  com.github.release.tag: cerit-cross-traefik/v1.0.0
